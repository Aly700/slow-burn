[project]
name = "breach-triage"
version = "0.1.0"
description = "Evidence-backed vulnerability triage with human-approved local tickets"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.20,<2",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2,<3",
  "mlx-lm>=0.28.3,<0.31; sys_platform == 'darwin'",
  "sentence-transformers>=5,<6", "huggingface-hub>=0.34,<1",
  "duckdb>=1.4,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
